# Keepalive de Supabase
#
# El free tier de Supabase PAUSA el proyecto si no ve "actividad
# suficiente" durante ~7 dias. La historia de esta guerra:
#   - SELECT vacio cada 3 dias → aviso de pausa (2026-08-26)
#   - 1 escritura diaria (RPC keepalive_ping, v15) → OTRO aviso
#     (2026-09-26) con 47 dias seguidos de latido en verde. El escaner
#     de avisos parece exigir mas volumen (aunque nunca llego a pausar).
#   - Ahora: RAFAGA de 20 escrituras + 1 lectura, 4 veces al dia
#     (~84 peticiones/dia — irrisorio para los limites del free tier).
#
# Usa la anon key (publica, la misma del frontend) — no necesita secrets.
#
# Bonus: si Supabase esta caido o pausado, el workflow falla y GitHub
# te avisa por email — funciona tambien como monitorizacion gratuita.
#
# Nota: GitHub deshabilita los crons si el repo lleva 60 dias sin
# commits. Si eso pasa, se reactiva con un click en la pestana Actions.
name: Keepalive Supabase

on:
  schedule:
    # Cada 6 horas (minuto 17 para esquivar los picos de crons de GitHub)
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Rafaga de latidos en Supabase
        run: |
          ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlnY3Z1Y3loY2Z5dXBtenN0b3FnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0MDc1MTcsImV4cCI6MjA5MDk4MzUxN30.dpC179HbuVLvSE_vs9DaED6eI3g0GDkllZoxg74N4YM'
          BASE='https://igcvucyhcfyupmzstoqg.supabase.co/rest/v1'
          OK=0
          ULTIMO=000
          # 20 escrituras (RPC keepalive_ping) espaciadas medio segundo
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /tmp/resp.json -w '%{http_code}' \
              -X POST "$BASE/rpc/keepalive_ping" \
              -H "apikey: $ANON_KEY" \
              -H "Authorization: Bearer $ANON_KEY" \
              -H "Content-Type: application/json" \
              -d '{}' || true)
            ULTIMO=${STATUS:-000}
            [ "$ULTIMO" = "200" ] && OK=$((OK + 1))
            sleep 0.5
          done
          # 1 lectura para variar el tipo de peticion
          curl -s -o /dev/null \
            "$BASE/profiles?select=id&limit=1" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" || true
          echo "Latidos OK: $OK/20 (ultimo HTTP: $ULTIMO)"
          if [ "$OK" -eq 0 ]; then
            echo "::error::Supabase no responde (HTTP $ULTIMO — si es 000 el dominio no resuelve, tipico de proyecto PAUSADO; si es 404, falta la migracion v15). Entra en https://supabase.com/dashboard, pulsa 'Restore project' si esta pausado, y relanza este workflow."
            exit 1
          fi
