# Keepalive de Supabase
#
# El free tier de Supabase PAUSA el proyecto si no ve "actividad
# suficiente" durante ~7 dias. Un SELECT vacio cada 3 dias no bastaba
# (aviso de pausa recibido el 2026-08-26 con el keepalive en verde),
# asi que ahora el ping es una ESCRITURA real — el RPC keepalive_ping
# de la migracion v15 — y corre a DIARIO.
#
# Usa la anon key (publica, la misma del frontend) — no necesita secrets.
#
# Bonus: si Supabase esta caido o pausado, el workflow falla y GitHub
# te avisa por email — funciona tambien como monitorizacion gratuita.
#
# Nota: GitHub deshabilita los crons si el repo lleva 60 dias sin
# commits. Si eso pasa, se reactiva con un click en la pestana Actions.
name: Keepalive Supabase

on:
  schedule:
    # Diario a las 09:17 UTC (minuto aleatorio para esquivar los picos
    # de crons de GitHub, que se retrasan)
    - cron: '17 9 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Latido en Supabase (escritura via RPC)
        run: |
          ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlnY3Z1Y3loY2Z5dXBtenN0b3FnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0MDc1MTcsImV4cCI6MjA5MDk4MzUxN30.dpC179HbuVLvSE_vs9DaED6eI3g0GDkllZoxg74N4YM'
          # '|| true' para que un fallo de curl (ej. DNS de proyecto
          # pausado, exit 6) no aborte el script antes del mensaje claro
          STATUS=$(curl -s -o /tmp/resp.json -w '%{http_code}' \
            -X POST \
            "https://igcvucyhcfyupmzstoqg.supabase.co/rest/v1/rpc/keepalive_ping" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' || true)
          echo "HTTP ${STATUS:-sin respuesta}"
          cat /tmp/resp.json 2>/dev/null || true
          if [ "$STATUS" != "200" ]; then
            echo "::error::Supabase no responde (HTTP ${STATUS:-000} — si es 000 el dominio no resuelve, tipico de proyecto PAUSADO; si es 404, falta aplicar la migracion v15). Entra en https://supabase.com/dashboard, pulsa 'Restore project' si esta pausado, y relanza este workflow."
            exit 1
          fi
          echo "Latido registrado ✔ (last_ping actualizado)"
